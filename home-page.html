    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBGUmZNzSpDM7VgpXS8g78yJ_O10sGvklQ",
            authDomain: "kumudocs.firebaseapp.com",
            projectId: "kumudocs",
            storageBucket: "kumudocs.firebasestorage.app",
            messagingSenderId: "652105060147",
            appId: "1:652105060147:web:715f7ec2a3760aad9fb846"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // DOM Elements
        const greetDesktop = document.getElementById('user-greeting-desktop');
        const greetMobile = document.getElementById('user-greeting-mobile');
        const logoutBtn = document.getElementById('logout-btn');

        // Auth Watcher & Dynamic Greeting
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // Fetch name from Firestore
                const userDocRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userDocRef);

                if (userSnap.exists()) {
                    const userData = userSnap.data();
                    const firstName = userData.name.split(' ')[0]; // Gets "Jordan" from "Jordan Recaña"
                    if (greetDesktop) greetDesktop.innerText = firstName + "!";
                    if (greetMobile) greetMobile.innerText = firstName + "!";
                }
            } else {
                // Not logged in? Kick them out.
                window.location.href = "./log-in.html";
            }
        });

        // Logout Feature
        if (logoutBtn) {
            logoutBtn.addEventListener('click', async () => {
                try {
                    await signOut(auth);
                    window.location.href = "/log-in.html"; 
                } catch (error) {
                    console.error("Logout Error:", error);
                    alert("Failed to log out.");
                }
            });
        }
    </script>
