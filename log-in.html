    <style>
        body { font-family: "Public Sans", sans-serif; }
        .material-symbols-outlined { font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24; }

<body class="bg-background text-on-background min-h-screen flex flex-col">
    <!-- TopAppBar -->
    <header class="bg-surface-container-lowest border-b border-outline-variant docked full-width top-0 z-50">
        <nav class="flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop py-4 max-w-container-width mx-auto">
            <div class="flex items-center gap-3">
                <img src="./KUMUDOCS.png" alt="KUMUDOCS Logo" class="h-8 w-auto object-contain"/>
                <div class="text-title-sm font-title-sm font-black text-primary uppercase tracking-tighter">KUMUDOCS</div>
            </div>
        </nav>
    </header>

    <main class="flex-grow flex items-center justify-center relative overflow-hidden bg-surface-container-lowest py-12 px-margin-mobile">
        <!-- Branding Header & Login Card -->
        <div class="w-full max-w-[480px] z-10">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-primary-container text-on-primary-container rounded-lg mb-4 shadow-sm">
                    <span class="material-symbols-outlined text-[40px]" style="font-variation-settings: 'FILL' 1;">fluid</span>
                </div>
                <h1 class="text-headline-md font-headline-md text-primary mb-2">LOGIN</h1>
                <p class="text-body-md font-body-md text-on-surface-variant">KUMUha ng DOCS</p>
            </div>
            <div class="bg-surface-container-lowest border border-outline-variant p-8 md:p-10 shadow-[0_4px_24px_rgba(0,42,92,0.06)] rounded-lg">
                <form id="login-form" class="space-y-6">
                    <div class="space-y-2">
                        <label class="block text-label-sm font-bold text-on-surface" for="email">Email Address</label>
                        <input class="w-full px-4 py-3 bg-white border border-outline-variant focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all text-body-md outline-none" id="email" name="email" placeholder="Enter your official email" required type="email"/>
                    </div>
                    <div class="space-y-2">
                        <label class="block text-label-sm font-bold text-on-surface" for="password">Password</label>
                        <input class="w-full px-4 py-3 bg-white border border-outline-variant focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all text-body-md outline-none" id="password" name="password" placeholder="••••••••" required type="password"/>
                    </div>
                    <button id="login-btn" class="w-full py-4 bg-primary text-on-primary font-bold text-body-md hover:bg-primary-container active:opacity-80 transition-all duration-200 shadow-sm flex justify-center items-center gap-2" type="submit">
                        LOGIN
                        <span class="material-symbols-outlined text-[20px]">login</span>
                    </button>
                </form>
                <div class="mt-8 pt-6 border-t border-outline-variant text-center">
                    <p class="text-body-md font-body-md text-on-surface-variant">
                        Don't have an account? 
                        <a class="text-primary font-bold hover:underline transition-all" href="register.html">Register</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

 <!-- Footer -->
<footer class="bg-surface-container border-t border-outline-variant">
<div class="flex flex-col md:flex-row justify-between items-center w-full px-margin-mobile md:px-margin-desktop py-8 max-w-[1200px] mx-auto">
<div class="mb-4 md:mb-0 text-center md:text-left">
<div class="text-label-sm font-label-sm font-bold text-primary mb-2">KUMUDOCS</div>
<p class="text-label-sm font-label-sm text-on-surface-variant max-w-xs">© 2024 KUMUDOCS. All government trademarks belong to their respective agencies.</p>
</div>
<div class="flex gap-6">
<a class="text-on-surface-variant hover:text-primary underline transition-all text-label-sm font-label-sm" href="#">Privacy Policy</a>
<a class="text-on-surface-variant hover:text-primary underline transition-all text-label-sm font-label-sm" href="#">Terms of Service</a>
</div>
</div>
</footer>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Replace with your actual Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBGUmZNzSpDM7VgpXS8g78yJ_O10sGvklQ",
            authDomain: "kumudocs.firebaseapp.com",
            projectId: "kumudocs",
            storageBucket: "kumudocs.firebasestorage.app",
            messagingSenderId: "652105060147",
            appId: "1:652105060147:web:715f7ec2a3760aad9fb846"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            btn.innerText = "LOGGING IN...";
            btn.disabled = true;

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                // Log user in
                await signInWithEmailAndPassword(auth, email, password);
                // Redirect on success
                window.location.href = "home-page.html";
            } catch (error) {
                console.error("Login Error:", error);
                alert("Login failed: " + error.message);
            } finally {
                btn.innerHTML = `LOGIN <span class="material-symbols-outlined text-[20px]">login</span>`;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
