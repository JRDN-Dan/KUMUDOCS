<body class="bg-background text-on-background min-h-screen flex flex-col">
<header class="bg-surface-container-lowest border-b border-outline-variant docked full-width top-0 z-50">
    <nav class="flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop py-4 max-w-container-width mx-auto">
        <div class="flex items-center gap-3">
            <img src="./KUMUDOCS.png" alt="KUMUDOCS Logo" class="h-8 w-auto object-contain"/>
            <div class="text-title-sm font-title-sm font-black text-primary uppercase tracking-tighter">KUMUDOCS</div>
        </div>
    </nav>
</header>

<main class="flex-grow flex items-center justify-center py-12 px-margin-mobile watermark-pattern">
<div class="w-full max-w-md">
<div class="bg-surface-container-lowest border border-outline-variant shadow-[0_8px_30px_rgb(0,42,92,0.04)] p-8 md:p-12">
<div class="text-center mb-10">
<div class="mb-6 inline-flex items-center justify-center w-16 h-16 bg-primary-container rounded-full">
<span class="material-symbols-outlined text-on-primary-container text-[40px]" data-icon="settings_accessibility">settings_accessibility</span>
</div>
<h1 class="text-headline-md font-headline-md text-primary mb-2">Create Account</h1>
<p class="text-body-md font-body-md text-on-surface-variant">KUMUha ng DOCS</p>
</div>

<form id="register-form" class="space-y-6">
<div class="space-y-2">
<label class="block text-label-sm font-bold text-on-surface" for="full-name">Name</label>
<input class="w-full px-4 py-3 bg-surface-container-lowest border border-outline-variant focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-all text-body-md font-body-md" id="full-name" name="full-name" placeholder="John Doe" type="text" required/>
</div>
<div class="space-y-2">
<label class="block text-label-sm font-bold text-on-surface" for="email">Email Address</label>
<input class="w-full px-4 py-3 bg-surface-container-lowest border border-outline-variant focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-all text-body-md font-body-md" id="email" name="email" placeholder="name@agency.gov" type="email" required/>
</div>
<div class="space-y-2">
<label class="block text-label-sm font-bold text-on-surface" for="phone">Cellphone Number</label>
<input class="w-full px-4 py-3 bg-surface-container-lowest border border-outline-variant focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-all text-body-md font-body-md" id="phone" name="phone" placeholder="+63 900 000 0000" type="tel" required/>
</div>
<div class="space-y-2">
<label class="block text-label-sm font-bold text-on-surface" for="password">Password</label>
<input class="w-full px-4 py-3 bg-surface-container-lowest border border-outline-variant focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-all text-body-md font-body-md" id="password" name="password" placeholder="••••••••" type="password" required minlength="6"/>
</div>
<div class="pt-4">
<button id="reg-btn" class="w-full bg-primary text-on-primary py-4 text-label-sm font-bold hover:bg-primary-container transition-all active:opacity-80" type="submit">
    REGISTER
</button>
</div>
<div class="text-center pt-4">
<p class="text-label-sm font-label-sm text-on-surface-variant">
    Already have an account? 
    <a class="text-primary font-bold hover:underline" href=".log-in.html">Login</a>
</p>
</div>
</form>
</div>
</main>

<!-- Footer -->
<footer class="bg-surface-container border-t border-outline-variant">

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Your Firebase Configuration (Keep this exactly as provided earlier)
    const firebaseConfig = {
        apiKey: "AIzaSyBGUmZNzSpDM7VgpXS8g78yJ_O10sGvklQ",
        authDomain: "kumudocs.firebaseapp.com",
        projectId: "kumudocs",
        storageBucket: "kumudocs.firebasestorage.app",
        messagingSenderId: "652105060147",
        appId: "1:652105060147:web:715f7ec2a3760aad9fb846"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('reg-btn');
        btn.innerText = "CREATING ACCOUNT...";
        btn.disabled = true;

        const name = document.getElementById('full-name').value;
        const email = document.getElementById('email').value;
        const phone = document.getElementById('phone').value;
        const password = document.getElementById('password').value;

        try {
            // 1. Create the user in Firebase Auth
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;

            // 2. Save the extra data in Firestore using the UID as the document ID
            await setDoc(doc(db, "users", user.uid), {
                name: name,
                email: email,
                phone: phone,
                photoURL: "https://ui-avatars.com/api/?name=" + encodeURIComponent(name)
            });

            alert("Account created successfully!");
            window.location.href = "./home-page.html";

        } catch (error) {
            console.error("Error during registration:", error);
            alert(error.message);
        } finally {
            btn.innerText = "REGISTER";
            btn.disabled = false;
        }
    });
</script>
